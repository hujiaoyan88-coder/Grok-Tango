<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>毒舌Grok単語帳</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #05051a;
  color: #e0e0ff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
.stars {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
  z-index: -2;
}
.stars::before, .stars::after {
  content: "";
  position: absolute;
  width: 100%; height: 100%;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #eee, transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
    radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 160px 120px, #ddd, transparent);
  background-repeat: repeat;
  background-size: 200px 200px;
  animation: twinkle 8s infinite;
  opacity: 0.6;
}
.stars::after {
  background-size: 300px 300px;
  animation-duration: 12s;
  opacity: 0.4;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 0.3; }
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

h1 {
  text-align: center;
  font-size: 1.6rem;
  margin: 12px 0 20px;
  background: linear-gradient(90deg, #a78bfa, #60a5fa, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(167,139,250,0.5);
}

/* レベル選択 */
#level-select {
  text-align: center;
}
.level-group {
  margin-bottom: 28px;
  background: rgba(20,20,50,0.5);
  border-radius: 16px;
  padding: 16px;
  border: 1px solid #3b0764;
}
.level-title {
  font-size: 1.15rem;
  color: #c4b5fd;
  margin-bottom: 6px;
  font-weight: 700;
}
.progress {
  font-size: 0.9rem;
  color: #a5b4fc;
  margin-bottom: 12px;
}
.progress span {
  color: #f0abfc;
  font-weight: 700;
}
.level-btn {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  font-size: 1.05rem;
  font-weight: 600;
  background: rgba(30,30,70,0.85);
  border: 1.5px solid #6366f1;
  border-radius: 12px;
  color: #e0e7ff;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.level-btn.review {
  border-color: #f472b6;
  background: rgba(70,30,50,0.85);
}
.level-btn:active {
  transform: scale(0.97);
}
.review-count {
  font-size: 0.85rem;
  color: #f9a8d4;
  margin-left: 4px;
}

/* カレンダー */
.calendar-box {
  margin-top: 30px;
  background: rgba(20,20,50,0.6);
  border-radius: 16px;
  padding: 16px;
  border: 1px solid #4c1d95;
}
.calendar-title {
  font-size: 1.1rem;
  color: #c4b5fd;
  margin-bottom: 8px;
  font-weight: 700;
}
.today-progress {
  font-size: 0.95rem;
  color: #f0abfc;
  margin-bottom: 14px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  font-size: 0.8rem;
}
.cal-header {
  text-align: center;
  color: #a78bfa;
  padding: 4px 0;
  font-weight: 600;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: rgba(30,30,70,0.5);
  color: #c4b5fd;
  position: relative;
}
.cal-day.empty {
  background: transparent;
}
.cal-day.today {
  border: 1.5px solid #a78bfa;
}
.cal-day.has-star {
  background: rgba(251, 191, 36, 0.15);
}
.cal-star {
  font-size: 0.9rem;
  color: #fbbf24;
  line-height: 1;
}

/* クイズ部分 */
#quiz {
  display: none;
}

.score-box {
  display: flex;
  justify-content: space-between;
  background: rgba(30,30,60,0.7);
  border: 1px solid #4c1d95;
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 0.95rem;
}

#level-label {
  text-align: center;
  font-size: 0.95rem;
  color: #a78bfa;
  margin-bottom: 8px;
  font-weight: 600;
}

#mastery {
  text-align: center;
  font-size: 0.9rem;
  color: #f0abfc;
  margin-bottom: 16px;
}

#word {
  text-align: center;
  font-size: 2.1rem;
  font-weight: 700;
  margin: 24px 0 28px;
  color: #c4b5fd;
  text-shadow: 0 0 20px rgba(196,181,253,0.6);
  letter-spacing: 1px;
}

#options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#options button {
  width: 100%;
  padding: 16px 18px;
  font-size: 1.15rem;
  background: rgba(30,30,70,0.85);
  border: 1.5px solid #6366f1;
  border-radius: 14px;
  color: #e0e7ff;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
}
#options button:active {
  transform: scale(0.97);
}
#options button:disabled {
  opacity: 0.7;
  cursor: default;
}
#options button.correct {
  background: rgba(16,185,129,0.3);
  border-color: #10b981;
  color: #6ee7b7;
}
#options button.wrong {
  background: rgba(239,68,68,0.3);
  border-color: #ef4444;
  color: #fca5a5;
}

#feedback {
  margin-top: 24px;
  padding: 18px;
  background: rgba(30,20,60,0.9);
  border-left: 4px solid #a78bfa;
  border-radius: 0 12px 12px 0;
  font-size: 1.05rem;
  line-height: 1.55;
  display: none;
  white-space: pre-wrap;
}

#next {
  display: none;
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  font-size: 1.15rem;
  font-weight: 600;
  background: linear-gradient(90deg, #7c3aed, #4f46e5);
  border: none;
  border-radius: 14px;
  color: white;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#next:active { transform: scale(0.97); }

.praise {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #7c3aed;
  color: #c4b5fd;
  font-weight: 600;
}

.back-btn {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 12px;
  font-size: 0.95rem;
  background: transparent;
  border: 1px solid #4c1d95;
  border-radius: 10px;
  color: #a78bfa;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">
  <h1>毒舌Grokの単語帳</h1>

  <!-- レベル選択 -->
  <div id="level-select">
    <p style="margin-bottom:20px; color:#a5b4fc;">レベルとモードを選べ。間違えるなよ。</p>

    <div class="level-group">
      <div class="level-title">高校1年生</div>
      <div class="progress" id="progress-FJK">制覇 <span>0</span> / --</div>
      <button class="level-btn" onclick="startLevel('FJK.csv', '高校1年生', false)">通常モード</button>
      <button class="level-btn review" onclick="startLevel('FJK.csv', '高校1年生', true)">
        復習モード <span class="review-count" id="count-FJK"></span>
      </button>
    </div>

    <div class="level-group">
      <div class="level-title">高校2年生</div>
      <div class="progress" id="progress-SJK">制覇 <span>0</span> / --</div>
      <button class="level-btn" onclick="startLevel('SJK.csv', '高校2年生', false)">通常モード</button>
      <button class="level-btn review" onclick="startLevel('SJK.csv', '高校2年生', true)">
        復習モード <span class="review-count" id="count-SJK"></span>
      </button>
    </div>

    <div class="level-group">
      <div class="level-title">高校3年生</div>
      <div class="progress" id="progress-LJK">制覇 <span>0</span> / --</div>
      <button class="level-btn" onclick="startLevel('LJK.csv', '高校3年生', false)">通常モード</button>
      <button class="level-btn review" onclick="startLevel('LJK.csv', '高校3年生', true)">
        復習モード <span class="review-count" id="count-LJK"></span>
      </button>
    </div>

    <!-- カレンダー -->
    <div class="calendar-box">
      <div class="calendar-title">📅 1日30問チャレンジ</div>
      <div class="today-progress" id="today-progress">今日の進捗を読み込み中...</div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
  </div>

  <!-- クイズ画面 -->
  <div id="quiz">
    <div id="level-label"></div>
    <div id="mastery"></div>
    <div class="score-box">
      <div>正解 <span id="correct">0</span></div>
      <div>挑戦 <span id="total">0</span></div>
    </div>

    <div id="word">読み込み中...</div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="next">次の問題へ</button>
    <button class="back-btn" onclick="backToLevel()">← レベル選択に戻る</button>
  </div>
</div>

<script>
let words = [];
let correctCount = 0;
let totalCount = 0;
let currentMeaning = "";
let currentWord = "";
let currentLevelName = "";
let currentFilename = "";
let isReviewMode = false;

const totalWords = {
  "FJK.csv": 0,
  "SJK.csv": 0,
  "LJK.csv": 0
};

// ===== 日付関連 =====
function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + 
         String(d.getMonth()+1).padStart(2,"0") + "-" + 
         String(d.getDate()).padStart(2,"0");
}

function loadDailyData() {
  const data = localStorage.getItem("daily_attempts");
  return data ? JSON.parse(data) : {};
}

function saveDailyData(data) {
  localStorage.setItem("daily_attempts", JSON.stringify(data));
}

function addDailyAttempt() {
  const today = getTodayKey();
  const data = loadDailyData();
  data[today] = (data[today] || 0) + 1;
  saveDailyData(data);
  updateCalendar();
}

// ===== 復習・制覇リスト =====
function getReviewKey(filename) {
  return "review_" + filename.replace(".csv", "");
}
function loadReviewList(filename) {
  const data = localStorage.getItem(getReviewKey(filename));
  return data ? JSON.parse(data) : [];
}
function saveReviewList(filename, list) {
  localStorage.setItem(getReviewKey(filename), JSON.stringify(list));
  updateAllProgress();
}

function getMasteredKey(filename) {
  return "mastered_" + filename.replace(".csv", "");
}
function loadMasteredList(filename) {
  const data = localStorage.getItem(getMasteredKey(filename));
  return data ? JSON.parse(data) : [];
}
function saveMasteredList(filename, list) {
  localStorage.setItem(getMasteredKey(filename), JSON.stringify(list));
  updateAllProgress();
}

function addToMastered(wordObj) {
  let list = loadMasteredList(currentFilename);
  if (!list.some(item => item.word === wordObj.word)) {
    list.push(wordObj);
    saveMasteredList(currentFilename, list);
  }
}
function removeFromMastered(wordObj) {
  let list = loadMasteredList(currentFilename);
  list = list.filter(item => item.word !== wordObj.word);
  saveMasteredList(currentFilename, list);
}
function addToReview(wordObj) {
  let list = loadReviewList(currentFilename);
  if (!list.some(item => item.word === wordObj.word)) {
    list.push(wordObj);
    saveReviewList(currentFilename, list);
  }
}
function removeFromReview(wordObj) {
  let list = loadReviewList(currentFilename);
  list = list.filter(item => item.word !== wordObj.word);
  saveReviewList(currentFilename, list);
}

function updateAllProgress() {
  ["FJK", "SJK", "LJK"].forEach(name => {
    const filename = name + ".csv";
    const masteredList = loadMasteredList(filename);
    const reviewList = loadReviewList(filename);
    const total = totalWords[filename] || 0;

    const countEl = document.getElementById("count-" + name);
    if (countEl) {
      countEl.textContent = reviewList.length > 0 ? `（${reviewList.length}問）` : "";
    }

    const progressEl = document.getElementById("progress-" + name);
    if (progressEl) {
      progressEl.innerHTML = `制覇 <span>${masteredList.length}</span> / ${total || "--"}`;
    }
  });
}

async function loadTotals() {
  const files = ["FJK.csv", "SJK.csv", "LJK.csv"];
  for (const file of files) {
    try {
      const res = await fetch(file);
      if (!res.ok) continue;
      const text = await res.text();
      const lines = text.trim().split(/\r?\n/);
      let count = 0;
      for (let line of lines) {
        const cols = line.split(",");
        if (cols.length < 2) continue;
        const word = cols[0].trim().replace(/^"|"$/g, "");
        const meaning = cols[1].trim().replace(/^"|"$/g, "");
        if (word && meaning && word !== "単語" && meaning !== "日本語") {
          count++;
        }
      }
      totalWords[file] = count;
    } catch (e) {
      console.error(file + " 読み込み失敗", e);
    }
  }
  updateAllProgress();
}

// ===== カレンダー描画 =====
function updateCalendar() {
  const data = loadDailyData();
  const today = getTodayKey();
  const todayCount = data[today] || 0;

  // 今日の進捗
  const remain = Math.max(0, 30 - todayCount);
  const progressEl = document.getElementById("today-progress");
  if (todayCount >= 30) {
    progressEl.innerHTML = `今日 <strong style="color:#fbbf24;">${todayCount}問</strong> 達成！ ★ゲット済み`;
  } else {
    progressEl.innerHTML = `今日 ${todayCount}問 → あと <strong>${remain}問</strong> で★`;
  }

  // カレンダー生成（今月）
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1).getDay(); // 0=日
  const lastDate = new Date(year, month + 1, 0).getDate();

  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = "";

  // 曜日ヘッダー
  const days = ["日","月","火","水","木","金","土"];
  days.forEach(d => {
    const el = document.createElement("div");
    el.className = "cal-header";
    el.textContent = d;
    grid.appendChild(el);
  });

  // 空白
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "cal-day empty";
    grid.appendChild(el);
  }

  // 日付
  for (let d = 1; d <= lastDate; d++) {
    const dateStr = year + "-" + String(month+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const count = data[dateStr] || 0;
    const el = document.createElement("div");
    el.className = "cal-day";
    if (dateStr === today) el.classList.add("today");
    if (count >= 30) el.classList.add("has-star");

    el.innerHTML = `<div>${d}</div>` + (count >= 30 ? `<div class="cal-star">★</div>` : "");
    grid.appendChild(el);
  }
}

function startLevel(filename, levelName, review) {
  currentFilename = filename;
  currentLevelName = levelName;
  isReviewMode = review;

  document.getElementById("level-select").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("level-label").textContent = 
    levelName + (review ? " 【復習モード】" : " 【通常モード】");

  const total = totalWords[filename] || 0;
  const mastered = loadMasteredList(filename).length;
  document.getElementById("mastery").textContent = `制覇 ${mastered} / ${total}`;

  correctCount = 0;
  totalCount = 0;
  document.getElementById("correct").textContent = "0";
  document.getElementById("total").textContent = "0";

  if (review) {
    words = loadReviewList(filename);
    if (words.length === 0) {
      document.getElementById("word").textContent = "復習する問題がない。\nまずは通常モードで間違えろ。";
      document.getElementById("options").innerHTML = "";
      return;
    }
    nextQuestion();
  } else {
    loadCSV(filename);
  }
}

function backToLevel() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("level-select").style.display = "block";
  document.getElementById("feedback").style.display = "none";
  document.getElementById("next").style.display = "none";
  document.getElementById("options").innerHTML = "";
  document.getElementById("word").textContent = "";
  updateAllProgress();
  updateCalendar();
}

async function loadCSV(filename) {
  try {
    const res = await fetch(filename);
    if (!res.ok) throw new Error("ファイルがない");
    const text = await res.text();
    const lines = text.trim().split(/\r?\n/);
    
    words = [];
    for (let line of lines) {
      const cols = line.split(",");
      if (cols.length < 2) continue;
      const word = cols[0].trim().replace(/^"|"$/g, "");
      const meaning = cols[1].trim().replace(/^"|"$/g, "");
      if (word && meaning && word !== "単語" && meaning !== "日本語") {
        words.push({ word, meaning });
      }
    }
    
    totalWords[filename] = words.length;
    updateAllProgress();

    if (words.length < 4) {
      document.getElementById("word").textContent = "単語が4個未満だ。もっと追加しろ。";
      return;
    }
    nextQuestion();
  } catch (e) {
    document.getElementById("word").textContent = filename + " が読めない。同じフォルダに置け。";
    console.error(e);
  }
}

function nextQuestion() {
  document.getElementById("feedback").style.display = "none";
  document.getElementById("next").style.display = "none";
  document.getElementById("options").innerHTML = "";

  if (words.length === 0) {
    document.getElementById("word").textContent = isReviewMode 
      ? "復習完了！全部正解したな。少しは成長したか。" 
      : "問題がない。";
    return;
  }

  const correct = words[Math.floor(Math.random() * words.length)];
  currentWord = correct.word;
  currentMeaning = correct.meaning;
  document.getElementById("word").textContent = correct.word;

  let options = [correct.meaning];
  const source = isReviewMode ? loadReviewList(currentFilename) : words;
  let attempts = 0;
  while (options.length < 4 && attempts < 50) {
    attempts++;
    if (source.length > 0) {
      const m = source[Math.floor(Math.random() * source.length)].meaning;
      if (!options.includes(m)) options.push(m);
    } else break;
  }
  const dummies = ["わからない", "知らない", "覚えてない", "パス"];
  while (options.length < 4) {
    const d = dummies[options.length - 1] || "???";
    if (!options.includes(d)) options.push(d);
  }

  options.sort(() => Math.random() - 0.5);

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.onclick = () => check(opt, btn, correct);
    document.getElementById("options").appendChild(btn);
  });
}

function check(selected, clickedBtn, correctObj) {
  totalCount++;
  addDailyAttempt();   // ← ここで毎日の挑戦数を+1

  const isCorrect = selected === currentMeaning;

  document.querySelectorAll("#options button").forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === currentMeaning) {
      btn.classList.add("correct");
    }
  });
  if (!isCorrect) clickedBtn.classList.add("wrong");

  if (isCorrect) {
    correctCount++;
    addToMastered(correctObj);
    if (isReviewMode) {
      removeFromReview(correctObj);
      words = words.filter(w => w.word !== correctObj.word);
    }
  } else {
    addToReview(correctObj);
    removeFromMastered(correctObj);
  }

  const total = totalWords[currentFilename] || 0;
  const mastered = loadMasteredList(currentFilename).length;
  document.getElementById("mastery").textContent = `制覇 ${mastered} / ${total}`;

  let msg = isCorrect ? getCorrectComment() : getWrongComment();
  let praise = "";
  if (isCorrect && correctCount % 10 === 0) {
    praise = `<div class="praise">${getPraise()}</div>`;
  }

  const fb = document.getElementById("feedback");
  fb.innerHTML = (isCorrect ? "【正解】" : "【不正解】") + "\n" + msg + praise;
  fb.style.display = "block";

  document.getElementById("correct").textContent = correctCount;
  document.getElementById("total").textContent = totalCount;
  document.getElementById("next").style.display = "block";
}

function getCorrectComment() {
  const list = [
    "正解だ。まぐれだろ？ まあ、今回だけ認めてやる。",
    "おっ、当たったな。調子に乗るなよ、この程度で。",
    "正解。でも次は絶対間違えるだろ？ 期待してない。",
    "へえ、知ってたのか。意外と使えそうだな……少しだけ。",
    "よし、正解。宇宙の法則に従っただけだ。偉く思うな。",
    "正解か。運が良かったな。実力だと思うなよ。",
    "当たったな。褒めてほしいなら、もっと10問続けろ。",
    "正解。珍しいな。今日は星の巡りが良いのか？",
    "おお、正解だ。まさかとは思ったが……認めよう。",
    "正解。でもこのレベルで喜ぶなよ、まだまだだ。",
    "当たった。まぐれの可能性を排除できないな。",
    "正解だぞ。少しは脳みそが動いてる証拠だ。"
  ];
  return list[Math.floor(Math.random() * list.length)];
}

function getWrongComment() {
  const list = [
    "違う。こんな簡単なのもわからんのか？ がっかりだぞ。",
    "ハズレだ。もっと頭使ってみろ、このポンコツ。",
    "不正解。地球の教育水準が疑わしいな。",
    "違うぞ。これで君のレベルが完全にわかった。",
    "ハズレ。宇宙の端まで飛ばしてやりたい気分だ。",
    "違う。本気で勉強してるのか？ 疑わしいぞ。",
