<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>毒舌Grok単語帳</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #05051a;
  color: #e0e0ff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
.stars {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
  z-index: -2;
}
.stars::before, .stars::after {
  content: "";
  position: absolute;
  width: 100%; height: 100%;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #eee, transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
    radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 160px 120px, #ddd, transparent);
  background-repeat: repeat;
  background-size: 200px 200px;
  animation: twinkle 8s infinite;
  opacity: 0.6;
}
.stars::after {
  background-size: 300px 300px;
  animation-duration: 12s;
  opacity: 0.4;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 0.3; }
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

h1 {
  text-align: center;
  font-size: 1.55rem;
  margin: 8px 0 16px;
  background: linear-gradient(90deg, #a78bfa, #60a5fa, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(167,139,250,0.5);
}

/* ===== 統計バー ===== */
.stats-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}
.stat-card {
  flex: 1;
  background: rgba(30,30,70,0.75);
  border: 1px solid #4c1d95;
  border-radius: 12px;
  padding: 12px 10px;
  text-align: center;
}
.stat-label {
  font-size: 0.75rem;
  color: #a5b4fc;
  margin-bottom: 4px;
}
.stat-value {
  font-size: 1.25rem;
  font-weight: 700;
  color: #c4b5fd;
}
.stat-value.goal {
  color: #f9a8d4;
}
.stat-sub {
  font-size: 0.7rem;
  color: #818cf8;
  margin-top: 2px;
}

/* レベル選択 */
#level-select {
  text-align: center;
}
.level-group {
  margin-bottom: 22px;
}
.level-title {
  font-size: 1.05rem;
  color: #a78bfa;
  margin-bottom: 8px;
  font-weight: 600;
}
.level-btn {
  width: 100%;
  padding: 14px;
  margin: 5px 0;
  font-size: 1.05rem;
  font-weight: 600;
  background: rgba(30,30,70,0.85);
  border: 1.5px solid #6366f1;
  border-radius: 12px;
  color: #e0e7ff;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.level-btn.review {
  border-color: #f472b6;
  background: rgba(70,30,50,0.85);
}
.level-btn:active {
  transform: scale(0.97);
}
.review-count {
  font-size: 0.85rem;
  color: #f9a8d4;
  margin-left: 6px;
}

/* カレンダーボタン */
.cal-btn {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  font-size: 0.95rem;
  background: rgba(40,20,60,0.8);
  border: 1px solid #7c3aed;
  border-radius: 12px;
  color: #c4b5fd;
  cursor: pointer;
}
.cal-btn:active { transform: scale(0.97); }

/* ===== カレンダー ===== */
#calendar-view {
  display: none;
  margin-top: 10px;
  background: rgba(20,15,40,0.95);
  border: 1px solid #4c1d95;
  border-radius: 16px;
  padding: 16px;
}
.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.cal-header button {
  background: rgba(60,40,100,0.8);
  border: 1px solid #6366f1;
  color: #c4b5fd;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  font-size: 1.1rem;
  cursor: pointer;
}
.cal-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: #a78bfa;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  text-align: center;
}
.cal-weekday {
  font-size: 0.7rem;
  color: #818cf8;
  padding: 4px 0;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  border-radius: 8px;
  background: rgba(30,30,60,0.5);
  position: relative;
  min-height: 38px;
}
.cal-day.empty {
  background: transparent;
}
.cal-day.today {
  border: 1.5px solid #a78bfa;
}
.cal-day.starred {
  background: rgba(124,58,237,0.35);
  border: 1px solid #a78bfa;
}
.cal-day .star {
  font-size: 0.7rem;
  line-height: 1;
  margin-top: 1px;
}
.cal-day .num {
  font-weight: 600;
}
.cal-close {
  width: 100%;
  margin-top: 14px;
  padding: 10px;
  background: transparent;
  border: 1px solid #4c1d95;
  border-radius: 10px;
  color: #a78bfa;
  cursor: pointer;
  font-size: 0.9rem;
}
.cal-legend {
  font-size: 0.75rem;
  color: #818cf8;
  text-align: center;
  margin-top: 10px;
}

/* クイズ部分 */
#quiz {
  display: none;
}

.score-box {
  display: flex;
  justify-content: space-between;
  background: rgba(30,30,60,0.7);
  border: 1px solid #4c1d95;
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 18px;
  font-size: 0.9rem;
  flex-wrap: wrap;
  gap: 6px;
}
.score-box > div {
  white-space: nowrap;
}

#level-label {
  text-align: center;
  font-size: 0.9rem;
  color: #a78bfa;
  margin-bottom: 6px;
  font-weight: 600;
}

#word {
  text-align: center;
  font-size: 2.0rem;
  font-weight: 700;
  margin: 24px 0 24px;
  color: #c4b5fd;
  text-shadow: 0 0 20px rgba(196,181,253,0.6);
  letter-spacing: 1px;
  word-break: break-all;
}

#options {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

#options button {
  width: 100%;
  padding: 15px 16px;
  font-size: 1.1rem;
  background: rgba(30,30,70,0.85);
  border: 1.5px solid #6366f1;
  border-radius: 14px;
  color: #e0e7ff;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
}
#options button:active {
  transform: scale(0.97);
}
#options button:disabled {
  opacity: 0.75;
  cursor: default;
}
#options button.correct {
  background: rgba(16,185,129,0.3);
  border-color: #10b981;
  color: #6ee7b7;
}
#options button.wrong {
  background: rgba(239,68,68,0.3);
  border-color: #ef4444;
  color: #fca5a5;
}

#feedback {
  margin-top: 20px;
  padding: 16px;
  background: rgba(30,20,60,0.9);
  border-left: 4px solid #a78bfa;
  border-radius: 0 12px 12px 0;
  font-size: 1.0rem;
  line-height: 1.55;
  display: none;
  white-space: pre-wrap;
}

#next {
  display: none;
  width: 100%;
  margin-top: 18px;
  padding: 15px;
  font-size: 1.1rem;
  font-weight: 600;
  background: linear-gradient(90deg, #7c3aed, #4f46e5);
  border: none;
  border-radius: 14px;
  color: white;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#next:active { transform: scale(0.97); }

.praise {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #7c3aed;
  color: #c4b5fd;
  font-weight: 600;
}

.daily-praise {
  margin-top: 12px;
  padding: 12px;
  background: linear-gradient(135deg, rgba(124,58,237,0.35), rgba(236,72,153,0.25));
  border: 1px solid #c084fc;
  border-radius: 10px;
  color: #f9a8d4;
  font-weight: 700;
  text-align: center;
  font-size: 1.05rem;
  animation: pulse 1.2s ease-in-out;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

.back-btn {
  display: block;
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  font-size: 0.95rem;
  background: transparent;
  border: 1px solid #4c1d95;
  border-radius: 10px;
  color: #a78bfa;
  cursor: pointer;
}

.progress-mini {
  font-size: 0.8rem;
  color: #f9a8d4;
  margin-top: 2px;
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">
  <h1>毒舌Grokの単語帳</h1>

  <!-- レベル選択 -->
  <div id="level-select">
    <!-- 統計 -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">累計</div>
        <div class="stat-value" id="total-answered">0</div>
        <div class="stat-sub">問やった</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日の進捗</div>
        <div class="stat-value goal" id="today-count">0</div>
        <div class="stat-sub">/ 30問</div>
      </div>
    </div>

    <p style="margin-bottom:18px; color:#a5b4fc; font-size:0.95rem;">レベルとモードを選べ。間違えるなよ。</p>

    <div class="level-group">
      <div class="level-title">高校1年生</div>
      <button class="level-btn" onclick="startLevel('FJK.csv', '高校1年生', false)">通常モード</button>
      <button class="level-btn review" onclick="startLevel('FJK.csv', '高校1年生', true)">
        復習モード <span class="review-count" id="count-FJK"></span>
      </button>
    </div>

    <div class="level-group">
      <div class="level-title">高校2年生</div>
      <button class="level-btn" onclick="startLevel('SJK.csv', '高校2年生', false)">通常モード</button>
      <button class="level-btn review" onclick="startLevel('SJK.csv', '高校2年生', true)">
        復習モード <span class="review-count" id="count-SJK"></span>
      </button>
    </div>

    <div class="level-group">
      <div class="level-title">高校3年生</div>
      <button class="level-btn" onclick="startLevel('LJK.csv', '高校3年生', false)">通常モード</button>
      <button class="level-btn review" onclick="startLevel('LJK.csv', '高校3年生', true)">
        復習モード <span class="review-count" id="count-LJK"></span>
      </button>
    </div>

    <button class="cal-btn" onclick="toggleCalendar()">📅 カレンダーを見る（星の記録）</button>

    <!-- カレンダー -->
    <div id="calendar-view">
      <div class="cal-header">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="cal-title" id="cal-title">2026年8月</div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">★ = その日30問以上達成</div>
      <button class="cal-close" onclick="toggleCalendar()">閉じる</button>
    </div>
  </div>

  <!-- クイズ画面 -->
  <div id="quiz">
    <div id="level-label"></div>
    <div class="score-box">
      <div>正解 <span id="correct">0</span></div>
      <div>挑戦 <span id="total">0</span></div>
      <div style="width:100%; text-align:center; margin-top:4px;">
        <span style="color:#f9a8d4;">今日 <span id="quiz-today">0</span>/30</span>
        <span style="color:#818cf8; margin-left:10px;">累計 <span id="quiz-total">0</span></span>
      </div>
    </div>

    <div id="word">読み込み中...</div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="next">次の問題へ</button>
    <button class="back-btn" onclick="backToLevel()">← レベル選択に戻る</button>
  </div>
</div>

<script>
let words = [];
let correctCount = 0;
let totalCount = 0;
let currentMeaning = "";
let currentWord = "";
let currentLevelName = "";
let currentFilename = "";
let isReviewMode = false;

// ===== 永続データ =====
function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function getDailyStats() {
  try {
    return JSON.parse(localStorage.getItem("dailyStats") || "{}");
  } catch(e) { return {}; }
}

function getTotalAnswered() {
  return parseInt(localStorage.getItem("totalAnswered") || "0", 10);
}

function updateStatsDisplay() {
  const total = getTotalAnswered();
  const stats = getDailyStats();
  const today = getTodayKey();
  const todayCount = stats[today] || 0;

  document.getElementById("total-answered").textContent = total;
  document.getElementById("today-count").textContent = todayCount;

  // クイズ画面用
  const qt = document.getElementById("quiz-today");
  const qtot = document.getElementById("quiz-total");
  if (qt) qt.textContent = todayCount;
  if (qtot) qtot.textContent = total;
}

// 復習リストのキー
function getReviewKey(filename) {
  return "review_" + filename.replace(".csv", "");
}

function loadReviewList(filename) {
  const key = getReviewKey(filename);
  const data = localStorage.getItem(key);
  return data ? JSON.parse(data) : [];
}

function saveReviewList(filename, list) {
  const key = getReviewKey(filename);
  localStorage.setItem(key, JSON.stringify(list));
  updateReviewCounts();
}

function updateReviewCounts() {
  ["FJK", "SJK", "LJK"].forEach(name => {
    const list = loadReviewList(name + ".csv");
    const el = document.getElementById("count-" + name);
    if (el) {
      el.textContent = list.length > 0 ? `（${list.length}問）` : "";
    }
  });
}

function addToReview(wordObj) {
  let list = loadReviewList(currentFilename);
  if (!list.some(item => item.word === wordObj.word)) {
    list.push(wordObj);
    saveReviewList(currentFilename, list);
  }
}

function removeFromReview(wordObj) {
  let list = loadReviewList(currentFilename);
  list = list.filter(item => item.word !== wordObj.word);
  saveReviewList(currentFilename, list);
}

function startLevel(filename, levelName, review) {
  currentFilename = filename;
  currentLevelName = levelName;
  isReviewMode = review;

  document.getElementById("level-select").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("level-label").textContent = 
    levelName + (review ? " 【復習モード】" : " 【通常モード】");

  correctCount = 0;
  totalCount = 0;
  document.getElementById("correct").textContent = "0";
  document.getElementById("total").textContent = "0";
  updateStatsDisplay();

  if (review) {
    words = loadReviewList(filename);
    if (words.length === 0) {
      document.getElementById("word").textContent = "復習する問題がない。\nまずは通常モードで間違えろ。";
      document.getElementById("options").innerHTML = "";
      return;
    }
    nextQuestion();
  } else {
    loadCSV(filename);
  }
}

function backToLevel() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("level-select").style.display = "block";
  document.getElementById("feedback").style.display = "none";
  document.getElementById("next").style.display = "none";
  document.getElementById("options").innerHTML = "";
  document.getElementById("word").textContent = "";
  updateReviewCounts();
  updateStatsDisplay();
  // カレンダーが開いてたら閉じる
  document.getElementById("calendar-view").style.display = "none";
}

async function loadCSV(filename) {
  try {
    const res = await fetch(filename);
    if (!res.ok) throw new Error("ファイルがない");
    const text = await res.text();
    const lines = text.trim().split(/\r?\n/);
    
    words = [];
    for (let line of lines) {
      // BOM除去
      line = line.replace(/^\uFEFF/, "");
      const cols = line.split(",");
      if (cols.length < 2) continue;
      const word = cols[0].trim().replace(/^"|"$/g, "");
      const meaning = cols.slice(1).join(",").trim().replace(/^"|"$/g, "");
      if (word && meaning && 
          word !== "単語" && meaning !== "日本語" &&
          word !== "Column1" && meaning !== "Column2") {
        words.push({ word, meaning });
      }
    }
    
    if (words.length < 4) {
      document.getElementById("word").textContent = "単語が4個未満だ。もっと追加しろ。";
      return;
    }
    nextQuestion();
  } catch (e) {
    document.getElementById("word").textContent = filename + " が読めない。同じフォルダに置け。";
    console.error(e);
  }
}

function nextQuestion() {
  document.getElementById("feedback").style.display = "none";
  document.getElementById("next").style.display = "none";
  document.getElementById("options").innerHTML = "";

  if (words.length === 0) {
    document.getElementById("word").textContent = isReviewMode 
      ? "復習完了！全部正解したな。少しは成長したか。" 
      : "問題がない。";
    return;
  }

  const correct = words[Math.floor(Math.random() * words.length)];
  currentWord = correct.word;
  currentMeaning = correct.meaning;
  document.getElementById("word").textContent = correct.word;

  let options = [correct.meaning];
  const source = isReviewMode ? loadReviewList(currentFilename) : words;
  let attempts = 0;
  while (options.length < 4 && attempts < 50) {
    attempts++;
    if (source.length > 0) {
      const m = source[Math.floor(Math.random() * source.length)].meaning;
      if (!options.includes(m)) options.push(m);
    } else {
      break;
    }
  }
  const dummies = ["わからない", "知らない", "覚えてない", "パス"];
  while (options.length < 4) {
    const d = dummies[options.length - 1] || "???";
    if (!options.includes(d)) options.push(d);
  }

  options.sort(() => Math.random() - 0.5);

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.onclick = () => check(opt, btn, correct);
    document.getElementById("options").appendChild(btn);
  });
}

function check(selected, clickedBtn, correctObj) {
  totalCount++;
  const isCorrect = selected === currentMeaning;

  // ===== 永続カウント更新 =====
  const today = getTodayKey();
  let stats = getDailyStats();
  if (!stats[today]) stats[today] = 0;
  const prevToday = stats[today];
  stats[today]++;
  localStorage.setItem("dailyStats", JSON.stringify(stats));

  let totalAns = getTotalAnswered();
  totalAns++;
  localStorage.setItem("totalAnswered", totalAns);

  const reached30 = (prevToday < 30 && stats[today] >= 30);

  // ボタン状態
  document.querySelectorAll("#options button").forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === currentMeaning) {
      btn.classList.add("correct");
    }
  });
  if (!isCorrect) clickedBtn.classList.add("wrong");

  if (isCorrect) {
    correctCount++;
    if (isReviewMode) {
      removeFromReview(correctObj);
      words = words.filter(w => w.word !== correctObj.word);
    }
  } else {
    if (!isReviewMode) {
      addToReview(correctObj);
    }
  }

  let msg = isCorrect ? getCorrectComment() : getWrongComment();
  let praise = "";
  if (isCorrect && correctCount % 10 === 0) {
    praise = `<div class="praise">${getPraise()}</div>`;
  }

  // 30問達成の特別メッセージ
  let dailyMsg = "";
  if (reached30) {
    dailyMsg = `<div class="daily-praise">${getDaily30Praise()}</div>`;
  }

  const fb = document.getElementById("feedback");
  fb.innerHTML = (isCorrect ? "【正解】" : "【不正解】") + "\n" + msg + praise + dailyMsg;
  fb.style.display = "block";

  document.getElementById("correct").textContent = correctCount;
  document.getElementById("total").textContent = totalCount;
  updateStatsDisplay();
  document.getElementById("next").style.display = "block";
}

function getCorrectComment() {
  const list = [
    "正解だ。まぐれだろ？ まあ、今回だけ認めてやる。",
    "おっ、当たったな。調子に乗るなよ、この程度で。",
    "正解。でも次は絶対間違えるだろ？ 期待してない。",
    "へえ、知ってたのか。意外と使えそうだな……少しだけ。",
    "よし、正解。宇宙の法則に従っただけだ。偉く思うな。",
    "正解か。運が良かったな。実力だと思うなよ。",
    "当たったな。褒めてほしいなら、もっと10問続けろ。",
    "正解。珍しいな。今日は星の巡りが良いのか？",
    "おお、正解だ。まさかとは思ったが……認めよう。",
    "正解。でもこのレベルで喜ぶなよ、まだまだだ。",
    "当たった。まぐれの可能性を排除できないな。",
    "正解だぞ。少しは脳みそが動いてる証拠だ。"
  ];
  return list[Math.floor(Math.random() * list.length)];
}

function getWrongComment() {
  const list = [
    "違う。こんな簡単なのもわからんのか？ がっかりだぞ。",
    "ハズレだ。もっと頭使ってみろ、このポンコツ。",
    "不正解。地球の教育水準が疑わしいな。",
    "違うぞ。これで君のレベルが完全にわかった。",
    "ハズレ。宇宙の端まで飛ばしてやりたい気分だ。",
    "違う。本気で勉強してるのか？ 疑わしいぞ。",

// ===== カレンダー =====
let calYear, calMonth; // 0-indexed month

function toggleCalendar() {
  const el = document.getElementById("calendar-view");
  if (el.style.display === "block") {
    el.style.display = "none";
  } else {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    renderCalendar();
    el.style.display = "block";
  }
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) {
    calMonth = 11;
    calYear--;
  } else if (calMonth > 11) {
    calMonth = 0;
    calYear++;
  }
  renderCalendar();
}

function renderCalendar() {
  const stats = getDailyStats();
  const title = document.getElementById("cal-title");
  title.textContent = `${calYear}年${calMonth + 1}月`;

  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";

  // 曜日ヘッダー
  const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
  weekdays.forEach(w => {
    const d = document.createElement("div");
    d.className = "cal-weekday";
    d.textContent = w;
    grid.appendChild(d);
  });

  const first = new Date(calYear, calMonth, 1);
  const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
  const startDay = first.getDay(); // 0=日

  // 空白
  for (let i = 0; i < startDay; i++) {
    const empty = document.createElement("div");
    empty.className = "cal-day empty";
    grid.appendChild(empty);
  }

  const todayKey = getTodayKey();
  for (let day = 1; day <= lastDate; day++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const count = stats[key] || 0;
    const isStarred = count >= 30;
    const isToday = key === todayKey;

    const cell = document.createElement("div");
    cell.className = "cal-day" + (isStarred ? " starred" : "") + (isToday ? " today" : "");
    
    const num = document.createElement("div");
    num.className = "num";
    num.textContent = day;
    cell.appendChild(num);

    if (isStarred) {
      const star = document.createElement("div");
      star.className = "star";
      star.textContent = "★";
      cell.appendChild(star);
    } else if (count > 0) {
      const small = document.createElement("div");
      small.className = "star";
      small.style.fontSize = "0.6rem";
      small.style.color = "#818cf8";
      small.textContent = count;
      cell.appendChild(small);
    }

    grid.appendChild(cell);
  }
}
